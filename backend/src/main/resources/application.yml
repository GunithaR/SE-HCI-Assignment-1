server:
  port: 8080
  servlet:
    context-path: /

spring:
  # ── DataSource ──────────────────────────────────────────────────────────────
  datasource:
    # ↓ Change 'root' username and 'root' password to your MySQL credentials
    url: jdbc:mysql://localhost:3306/construction_platform?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&useUnicode=true&characterEncoding=UTF-8
    username: root          # ← XAMPP default username
    password:
    driver-class-name: com.mysql.cj.jdbc.Driver

  # ── JPA / Hibernate ─────────────────────────────────────────────────────────
  jpa:
    hibernate:
      ddl-auto: update       # Hibernate auto-creates/updates tables from @Entity classes
    show-sql: true
    properties:
      hibernate:
        # Let Hibernate auto-detect MySQL dialect (no deprecation warning)
        format_sql: true

  # ── Multipart file upload ────────────────────────────────────────────────
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 12MB

  # ── Jackson ─────────────────────────────────────────────────────────────────
  jackson:
    serialization:
      write-dates-as-timestamps: false

# ── File uploads ─────────────────────────────────────────────────────────────
app:
  upload:
    dir: uploads/products
  seed:
    admin-email: admin@platform.com
    admin-password: Admin@1234

# ── JWT ─────────────────────────────────────────────────────────────────────
jwt:
  # 256-bit Base64-encoded secret key – CHANGE THIS in production!
  secret: "YnVpbGQtbXVsdGktYnJhbmQtY29uc3RydWN0aW9uLXBsYXRmb3JtLXNlY3JldC1rZXk="
  expiration-ms: 86400000   # 24 hours

ai:
  gemini:
    api-key: 
    url: https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-lite:generateContent
  openrouter:
    api-key: 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
    url: https://openrouter.ai/api/v1/chat/completions
    model: google/gemini-2.5-flash

# ── Logging ──────────────────────────────────────────────────────────────────
logging:
  level:
    org.springframework.security: INFO
    com.constructionplatform: DEBUG
