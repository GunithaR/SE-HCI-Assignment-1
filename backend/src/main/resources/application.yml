server:
  port: 8080
  servlet:
    context-path: /

spring:
  # ── DataSource ──────────────────────────────────────────────────────────────
  datasource:
    # ↓ Change 'root' username and 'root' password to your MySQL credentials
    url: ${DB_URL:jdbc:postgresql://localhost:5432/construction_platform}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver

  # ── JPA / Hibernate ─────────────────────────────────────────────────────────
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  # ── Multipart file upload ────────────────────────────────────────────────
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 12MB

  # ── Jackson ─────────────────────────────────────────────────────────────────
  jackson:
    serialization:
      write-dates-as-timestamps: false

# ── File uploads ─────────────────────────────────────────────────────────────
app:
  upload:
    dir: uploads/products
  seed:
    admin-email: admin@platform.com
    admin-password: Admin@1234

# ── JWT ─────────────────────────────────────────────────────────────────────
jwt:
  # 256-bit Base64-encoded secret key – CHANGE THIS in production!
  secret: ${JWT_SECRET:YnVpbGQtbXVsdGktYnJhbmQtY29uc3RydWN0aW9uLXBsYXRmb3JtLXNlY3JldC1rZXk=}
  expiration-ms: 86400000   # 24 hours

ai:
  gemini:
    api-key: ${GEMINI_API_KEY:}
    url: https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-lite:generateContent
  openrouter:
    api-key: ${OPENROUTER_API_KEY:}
    url: https://openrouter.ai/api/v1/chat/completions
    model: google/gemini-2.5-flash

# ── Logging ──────────────────────────────────────────────────────────────────
logging:
  level:
    org.springframework.security: INFO
    com.constructionplatform: DEBUG
